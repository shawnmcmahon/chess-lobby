name: Review hook checks
on:
  pull_request:
    paths: ['.github/codex/**', '.github/workflows/codex-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/codex/review-engine.test.cjs
      - name: Check the offline Convex validation command
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc --project convex/tsconfig.json --noEmit
      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint .github/workflows/codex-*.yml
