name: Codex review follow-up
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to replay against its current trusted review findings'
        required: true
        type: string
permissions: {}
jobs:
  follow-up:
    concurrency:
      group: codex-review-${{ github.event.issue.number || inputs.pull_request }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && github.event.comment.user.id == 199175422)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: shawnmcmahon/chess-lobby/.github/workflows/codex-review-engine.yml@33fa3b6d4595ed95ae8a0787dcf07a37fec610a2
    with:
      engine_ref: 33fa3b6d4595ed95ae8a0787dcf07a37fec610a2
      profile: chess-lobby
      node_version: '22'
      repair_enabled: ${{ vars.CODEX_REVIEW_REPAIR_ENABLED == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
