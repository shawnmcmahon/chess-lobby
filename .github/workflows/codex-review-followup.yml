name: Codex review follow-up
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to replay against its current trusted review findings'
        required: true
        type: string
permissions: {}
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false
jobs:
  follow-up:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.user.login == 'chatgpt-codex-connector[bot]' && github.event.review.user.id == 199175422) ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && github.event.comment.user.id == 199175422)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: shawnmcmahon/chess-lobby/.github/workflows/codex-review-engine.yml@4ded11f757aaa0f23a75d0ca63292ecce1598582
    with:
      engine_ref: 4ded11f757aaa0f23a75d0ca63292ecce1598582
      profile: chess-lobby
      node_version: '22'
      repair_enabled: ${{ vars.CODEX_REVIEW_REPAIR_ENABLED == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
