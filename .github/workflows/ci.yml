name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud

  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build apps/chess-engine/ChessEngine.csproj -c Release
      - run: dotnet test tests/ChessEngine.Tests/ChessEngine.Tests.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --experimental-strip-types --test tests/computer-engine.test.mjs
      - run: ./tests/deploy-engine-lambda.tests.ps1
        shell: pwsh
      - run: docker buildx build --platform linux/amd64 --provenance=false --load -f apps/chess-engine/Dockerfile.lambda -t chess-engine-lambda:test .
      - run: node scripts/test-engine-lambda.mjs --image chess-engine-lambda:test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint infra/engine-lambda/*.yaml
      - name: Authenticate image publisher
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENGINE_IMAGE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ENGINE_IMAGE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish validated candidate image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENGINE_IMAGE_ROLE_ARN != ''
        env:
          ENGINE_ECR_REPOSITORY: ${{ vars.ENGINE_ECR_REPOSITORY }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          repository="${ENGINE_ECR_REPOSITORY:-chess-lobby-engine-lambda-ecr-images}"
          registry="$account.dkr.ecr.us-east-1.amazonaws.com"
          tag="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$registry"
          docker tag chess-engine-lambda:test "$registry/$repository:$tag"
          docker push "$registry/$repository:$tag"
          aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" --query 'imageDetails[0].{digest:imageDigest,compressedBytes:imageSizeInBytes}' --output json

  convex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx convex dev --once --typecheck=enable
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
