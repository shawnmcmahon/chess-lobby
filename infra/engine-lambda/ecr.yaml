AWSTemplateFormatVersion: '2010-09-09'
Description: Private image storage for the on-demand Chess Lobby engine
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-images'
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: 'keep-*'
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaImageRetrieval
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:chess-lobby-engine-*'
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Protect the two rotating deployment pins","selection":{"tagStatus":"tagged","tagPrefixList":["keep-"],"countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}},{"rulePriority":2,"description":"Expire untagged builds after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":3,"description":"Keep the three most recent candidate images","selection":{"tagStatus":"tagged","tagPrefixList":["release-"],"countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}}]}
Outputs:
  RepositoryName:
    Description: Private ECR repository name
    Value: !Ref Repository
  RepositoryUri:
    Description: Private ECR image URI prefix
    Value: !GetAtt Repository.RepositoryUri
